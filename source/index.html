<!DOCTYPE html>
<html class="page" lang="en-US">

<head>
  <meta charset="UTF-8">
  <title>Feature support</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preload" href="#" type="font/woff2" as="font">
  <link rel="stylesheet" href="styles/styles.css">

  <link rel="icon" href="favicon.ico">
  <link rel="icon" href="favicons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicons/apple.png"> <!-- 180×180 -->
  <link rel="manifest" href="manifest.webmanifest">
</head>

<body class="page__body">
  <main class="page__main">

    <article class="page__container container">
      <h1 class="page__title title">Feature support</h1>
      <form class="page__form form" action="#">
        <p class="form__text" id="input-declaration"></p>

        <div class="form__input-wrapper">
          <select class="form__select" name="feature-type" id="feature-type">
            <optgroup class="form__optgroup" label="CSS">
              <option class="form__option" value="property">
                Property
              </option>
              <option class="form__option" value="custom properties">
                Custom properties
              </option>
              <option class="form__option" value="selector">
                Selector
              </option>
            </optgroup>

            <optgroup class="form__optgroup" label="CSS Units">
              <option class="form__option" value="color-units">
                Color units
              </option>
              <option class="form__option" value="length-units">
                Length units
              </option>
              <option class="form__option" value="angle-units">
                Angle units
              </option>
            </optgroup>
          </select>

          <label>
            <span class="visually-hidden">Write value for checking</span>
            <input class="form__input" type="text" name="feature-input">
          </label>

          <input class="form__submit" type="submit" value="Check">

          <output class="form__result" name="output"></output>
        </div>
      </form>
    </article>
  </main>

  <footer class="page__container container page__footer footer">
    <p class="footer__footnote footnote">I'll be glad for any feedback or suggestions</p>
    <a class="footer__link link icon-text icon-text--github" href="https://github.com/urchifox/check-feature-support">github repo</a>
    <a class="footer__link link icon-text icon-text--gmail" href="mailto:urchifox@gmail.com">urchifox@gmail.com</a>
  </footer>

  <script src="scripts/index.js" type="module"></script>
</body>

</html>
